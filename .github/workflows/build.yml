name: build

on:
  push:
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake g++ libopencv-dev

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_COMPILE_WARNING_AS_ERROR=ON

      - name: Build
        run: cmake --build build -j

      # No camera on CI runners: only check the commands that work without one.
      - name: Smoke test
        run: |
          ./build/facerec --help
          ./build/facerec list --models-dir "$RUNNER_TEMP/models"
          ./build/facerec enroll && exit 1 || test $? -eq 1
